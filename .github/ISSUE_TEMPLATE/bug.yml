name: Bug report
description: Something is broken or not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      placeholder: Backend, Frontend, Database, Auth
  - type: markdown
    attributes:
      value: Do not paste secrets, `.env` values, or API keys.
